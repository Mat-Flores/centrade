# Profil core (SPEC §5, §13). Sources : https://docs.docker.com/reference/compose-file/
name: centrade

x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  restart: unless-stopped

services:
  postgres:
    <<: *hardened
    profiles: [core]
    image: timescale/timescaledb:2.30.2-pg16@sha256:6f139d56042989bd35f50ba5986e492cd32e35cc6778c50be2659add298dc09f
    user: "70:70"
    environment:
      POSTGRES_USER: centrade
      POSTGRES_DB: centrade
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=70,gid=70,mode=0755
    networks: [data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "centrade", "-d", "centrade"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  redis:
    <<: *hardened
    profiles: [core]
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    user: "999:1000"
    # Le fichier secret ne contient que `requirepass <valeur>` : rien en ligne de commande.
    command: ["redis-server", "/run/secrets/redis_conf", "--appendonly", "yes"]
    secrets: [redis_conf]
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(sed -n 's/^requirepass //p' /run/secrets/redis_conf) redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    <<: *hardened
    profiles: [core]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: centrade/api:dev
    tmpfs: [/tmp]
    networks: [edge, data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/system/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    <<: *hardened
    profiles: [core]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: centrade/web:dev
    # Le binaire caddy porte la capacité de fichier NET_BIND_SERVICE : hors de l'ensemble
    # autorisé, son exécution échoue (« operation not permitted »).
    cap_add: [NET_BIND_SERVICE]
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12

  caddy:
    <<: *hardened
    profiles: [core]
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    # Reste root : le volume de données de l'image appartient à root.
    # NET_BIND_SERVICE seule : même raison que pour `web`.
    cap_add: [NET_BIND_SERVICE]
    environment:
      CENTRADE_HOSTNAME: ${CENTRADE_HOSTNAME:-localhost}
    ports:
      - "${CENTRADE_BIND_ADDR:-127.0.0.1}:${CENTRADE_HTTPS_PORT:-8443}:8443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    tmpfs: [/config]
    networks: [edge]
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  edge: {}
  data:
    internal: true

volumes:
  postgres_data: {}
  redis_data: {}
  caddy_data: {}

secrets:
  postgres_password:
    file: ../../secrets/postgres_password
  redis_conf:
    file: ../../secrets/redis.conf
