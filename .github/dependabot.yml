version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /deploy/caddy
    schedule:
      interval: weekly
  - package-ecosystem: gomod # Caddy et ses dépendances (deploy/caddy/build)
    directory: /deploy/caddy/build
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
