# OmniRoute: local AI gateway (https://github.com/diegosouzapw/OmniRoute)
#
# Standalone, not part of the app stack. Run it only when needed:
#   cd docker/omniroute
#   cp .env.example .env        # then edit .env (see comments)
#   docker compose up -d        # start
#   docker compose down         # stop (data is kept in the named volume)
#
# Dashboard + API: http://127.0.0.1:20128  (OpenAI-compatible endpoint: /v1)

services:
  omniroute:
    image: diegosouzapw/omniroute:${OMNIROUTE_TAG:-latest}
    container_name: omniroute
    restart: "no"                 # started on demand, never on boot
    stop_grace_period: 40s        # SQLite checkpoint on shutdown
    env_file: .env
    environment:
      DATA_DIR: /app/data
    ports:
      # Loopback only: provider keys live in this container, nothing on the LAN.
      - "127.0.0.1:20128:20128"
    volumes:
      - omniroute-data:/app/data  # holds DB + generated secrets (server.env)
    # --- hardening ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true               # writable paths: /app/data volume and /tmp only
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    pids_limit: 256
    mem_limit: 3g
    cpus: 2
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  omniroute-data:
