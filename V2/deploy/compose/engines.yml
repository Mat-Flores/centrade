# Engines profile (SPEC §5, §13): socket proxy and engine networks. To compose with core.yml
# (see COMPOSE_ENGINES in the Makefile). The engine containers are not in it: the runner
# creates them with the Docker SDK, they do not belong to the Compose project and survive `down` (I9).
# Sources: https://github.com/Tecnativa/docker-socket-proxy
name: centrade

services:
  docker-socket-proxy:
    profiles: [engines]
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/run, /tmp]
    environment:
      # Container operations only: list, inspect, logs (GET), then create,
      # start, stop, remove (POST, DELETE). `info` gives the host's memory (admission).
      CONTAINERS: 1
      POST: 1
      INFO: 1
      # Explicitly refused (default values, written so that a review sees them):
      # exec, build, images (hence no download at runtime: `make engines-pull`),
      # volumes, secrets, configs, swarm, services, tasks, nodes, networks, plugins, system.
      EXEC: 0
      BUILD: 0
      COMMIT: 0
      IMAGES: 0
      DISTRIBUTION: 0
      VOLUMES: 0
      SECRETS: 0
      CONFIGS: 0
      SWARM: 0
      SERVICES: 0
      TASKS: 0
      NODES: 0
      NETWORKS: 0
      PLUGINS: 0
      SYSTEM: 0
      AUTH: 0
      SESSION: 0
      GRPC: 0
      EVENTS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker]

  # The worker drives Docker (`docker` network) and reaches the engines (`engines` network). The
  # app, data and edge networks of core.yml are unchanged; the runtime directory (held in memory on
  # the host) is mounted at the same path, since Docker resolves mounts on the host. To prepare:
  # `sudo install -d -m 700 -o 10001 /run/centrade` (recreated at every host restart).
  # Master key: by Docker secret (file, never a variable), and in this profile only. The
  # worker needs it for the engines' native API credentials (SecretStore, usage
  # `engine_api`); without a container-based engine, core.yml does not give it to it.
  worker:
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      ENGINE_RUNTIME_DIR: ${ENGINE_RUNTIME_DIR:-/run/centrade}
      CENTRADE_MASTER_KEY_FILE: /run/secrets/master_key
    secrets: [master_key]
    volumes:
      - ${ENGINE_RUNTIME_DIR:-/run/centrade}:${ENGINE_RUNTIME_DIR:-/run/centrade}
    networks: [docker, engines]
    depends_on:
      docker-socket-proxy: {condition: service_started}

networks:
  # Worker and socket proxy only; no route to the outside.
  docker:
    internal: true
  # Engines, worker (and the Risk service in M3). Internal: no exit to the Internet. The engines'
  # exits to venues (domain allowlist) are an M7 topic; until then, the
  # engines only run in paper on local data or a stand-in.
  engines:
    internal: true
